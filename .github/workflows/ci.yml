# 构建与离线校验；不调用任何模型 API，不使用任何 API key。
# / Build and offline checks; no model API calls and no API keys.
name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: Bank matches spec
        run: go run ./cmd/meyrin bank check

      - name: Model list matches spec
        run: go run ./cmd/meyrin models check
